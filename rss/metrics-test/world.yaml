---
type: "RectangularWorld"
size:  # in meters
  - 8
  - 8
time_step: !np 1 / 40  # 0.025 seconds
seed: <{ seed|default(2023) }>
spawners:
  - type: UniformAgentSpawner
    n: 8  # default number of agents BUT may be overridden by user args
    facing: away
    region: [[3.4, 3.4], [3.4, 4.6], [4.6, 4.6], [4.6, 3.4]]
    agent: !include turbopi.yaml
metrics:
  - type: MovingMass
    weights: [1, 5]
  - type: Boids
    linear: [1, 1, 3]
    separation_metric:
      history_size: 450
      linear: [[0, 0.3], [0, 1]]
      clamp: [0, 1]
    cohesion_metric:
      history_size: 450
      linear: [[0.9, 1., 1.1], [3, 0, -3]]
      clamp: [-3, 3]
    alignment_metric:
      history_size: 450
      pre_exponent: 1
      post_exponent: 2

metadata:
  hash: _hash
stop_at: 1000 # Upper Simulation Limit (timesteps)

